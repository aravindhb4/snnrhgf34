<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guest Bedroom Large</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one drawing sheet per room; plan, elevations, 3D, spec */
:root{
  --bg:#f7f7f5; --fg:#1d1d1b; --muted:#76746f; --line:#d9d7d2;
  --wood:#d8c3a3; --ivory:#efe8d6; --emerald:#2f6b55; --ebony:#5a463b; --wood2:#b9a08a; --cream:#efe6cf; --white:#fbfbf9; --granite:#3a3936; --glass:#dfe8ea;
  --panel:#eeebe5; --fabric:#c9c6bd; --door:#9c7d5f; --tile:#e6e3dc; --accent:#b4612b;
  --font:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --ivory:#cfc8b6; --emerald:#2f6b55; --ebony:#3f3129; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --ivory:#cfc8b6; --emerald:#2f6b55; --ebony:#3f3129; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:36px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
p{margin:0;color:var(--muted);max-width:65ch}
.sheet{overflow-x:auto;border-top:1px solid var(--line);padding-top:16px}
svg{display:block;width:100%;height:auto;min-width:600px}
.plan svg{max-width:640px;min-width:420px}
.elevs{display:grid;gap:28px}
#three{width:100%;aspect-ratio:16/10;max-width:100%;border-top:1px solid var(--line);cursor:grab;touch-action:none}
.hint{font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;justify-self:start}
.seg a{font-size:13px;padding:6px 14px;color:var(--muted);text-decoration:none;border-right:1px solid var(--line)}
.seg a:last-child{border-right:0}
.seg a[aria-current="true"]{background:var(--fg);color:var(--bg)}
.seg a:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.chg{color:var(--accent)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 24px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
dt{color:var(--muted)} dd{margin:0;min-width:0}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:520px){dl{grid-template-columns:1fr} dd{margin-bottom:8px}}
</style>
<style>main{grid-template-columns:minmax(0,1fr)}main div,main section,main figure{min-width:0}.plan,.sheet{overflow-x:auto}</style>
</head>
<body>


<main>
  <header style="display:grid;gap:10px">
    <h1>F34 · Guest Bedroom Large</h1>
    <p>The 10×15 room (earlier called Bedroom 2) with attached bath. Layout from site photo IMG_3053 and the sale-agreement plan (updated 19 Nov). Sizes in mm, estimates until site measurement.</p>
      </header>
  <section>
    <h2>3D view</h2>
    <div id="three"></div>
    <p class="hint">Drag to rotate. Scroll or pinch to zoom.</p>
  </section>

  <section>
    <h2 id="rtitle"></h2>
    <p id="rnote"></p>
  </section>

  <section>
    <h2>Plan</h2>
    <div class="sheet plan"><svg id="plan" role="img" aria-label="Room plan"></svg></div>
  </section>

  <section>
    <h2>Elevations</h2>
    <div class="elevs" id="elevs"></div>
  </section>


  <section>
    <h2>Spec</h2>
    <dl class="tab" id="spec"></dl>
  </section>
</main>

<script src="../js/three.min.js"></script>
<script src="../js/OrbitControls.js"></script>
<script>
const CEIL=2900, DH=2100;

/* ---------- geometry helpers (mm). Room: x east 0..W, z south 0..D.
   Wall-local: u runs left→right as seen from inside, t = distance out from wall. ---------- */
const wlen=(R,w)=>(w==='N'||w==='S')?R.W:R.D;
function P(R,w,u,t){switch(w){case'N':return[u,t];case'E':return[R.W-t,u];case'S':return[R.W-u,R.D-t];case'W':return[t,R.D-u]}}
function W2R(R,w,u0,uw,t0,td){const a=P(R,w,u0,t0),b=P(R,w,u0+uw,t0+td);
  return{x:Math.min(a[0],b[0]),z:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),d:Math.abs(a[1]-b[1])}}
function R2W(R,w,b){switch(w){
  case'N':return{u0:b.x,uw:b.w,t:b.z};
  case'E':return{u0:b.z,uw:b.d,t:R.W-b.x-b.w};
  case'S':return{u0:R.W-b.x-b.w,uw:b.w,t:R.D-b.z-b.d};
  case'W':return{u0:R.D-b.z-b.d,uw:b.d,t:b.x}}}
function room(o){o.items=[];return o}
/* corner radii: number = all corners, or {bl,br,tr,tl}; clamped to size */
function RC(r,w,h){const o=typeof r==='number'?{bl:r,br:r,tr:r,tl:r}:{bl:0,br:0,tr:0,tl:0,...(r||{})},m=Math.min(w,h)/2-1;for(const k in o)o[k]=Math.max(0,Math.min(o[k],m));return o}
/* shutter radii: only corners that sit on a rounded outer corner of the unit */
function SRC(rc,j,i,cols,rows,inset){const o={};if(!rc)return 0;
  if(j===0&&i===0&&rc.bl)o.bl=Math.max(rc.bl-inset,0); if(j===cols-1&&i===0&&rc.br)o.br=Math.max(rc.br-inset,0);
  if(j===cols-1&&i===rows-1&&rc.tr)o.tr=Math.max(rc.tr-inset,0); if(j===0&&i===rows-1&&rc.tl)o.tl=Math.max(rc.tl-inset,0); return o}
function A(R,wall,kind,u0,uw,y0,h,td,o={}){const t0=o.t0||0;R.items.push({kind,wall,u0,uw,y0,h,td,t0,b:W2R(R,wall,u0,uw,t0,td),...o})}
function L(R,kind,x,z,w,d,y0,h,o={}){R.items.push({kind,loose:true,b:{x,z,w,d},y0,h,on:o.on||[],...o})}

/* ---------- rooms ---------- */
const ROOMS={};

/* Bedroom 2 15'0" x 10'6" (the 10x15 room) */
{const R=room({id:'bedroom-2',name:'Summary',W:4570,D:3200,
  note:'Layout confirmed with Aravindh on 19 Nov: study table between window and room door, mirror on the first wardrobe door, open shelves beside the bed.',
  elevs:[['E','A','Bathroom door wall (photo IMG_3053)'],['N','B','Open shelves and wardrobe'],['S','C','Window, study table and room door'],['W','D','Bed wall']]});
 A(R,'N','open',2320,350,1200,1200,400,{mat:'ebony',shelves:3,lab:'open',dim:true,prc:{fl:60}});
 A(R,'N','unit',2670,1900,0,2400,600,{mat:'ivory',cols:4,mirrorCol:0,lab:'wardrobe 4 doors',dim:true,rc:{bl:60},prc:{fl:60}});
 A(R,'N','unit',2320,825,2400,500,600,{mat:'ivory',cols:1});
 A(R,'N','unit',3145,1425,2400,500,600,{mat:'ivory',cols:3,flip:true});
 A(R,'E','door',550,800,0,DH,40,{lab:'bathroom',swing:null,dim:true});
 A(R,'E','board',1450,120,1000,90,10,{lab:'existing switch'});
 A(R,'S','window',2470,1800,0,DH,40,{rail:true,dim:true});
 A(R,'S','pelmet',2370,2000,DH,CEIL-DH,180,{}); // pelmet from the window head to the ceiling (20 Nov)
 A(R,'S','ac',2870,1000,2450,300,230,{t0:180,lab:'AC'}); // wall split AC centred on the pelmet (Aravindh 20 Nov)
 A(R,'S','door',20,900,0,DH,40,{lab:'room door',swing:'L',dim:true});
 /* Book ledges (Aravindh, 22 Nov, designer meeting): bookshelf no longer L-shaped; long north wall only, no closed units or back panels.
    Three floating ebony ledges, corner to the open shelf, 250 deep, 36 thick, tops at 1236 / 1636 / 2036. Books stand on top (representation only). */
 [1200,1600,2000].forEach((y,k)=>A(R,'N','ledge',0,2320,y,36,250,{mat:'ebony',lab:k===1?'book ledges':null,dim:k===0}));
 R.items.filter(it=>it.kind==='ledge').forEach((it,k)=>{let sd=7+k*131;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const B=[],y=it.y0+it.h,ch=360;let u=it.u0+40;const end=it.u0+it.uw-40;
  while(u<end){if(rnd()<0.07){u+=60+rnd()*120;continue}
   const w=18+rnd()*30;if(u+w>end)break;B.push([u,w,y,Math.min(330,ch*(0.55+rnd()*0.35)),150+rnd()*80,Math.floor(rnd()*8)]);u+=w+1}
  it.books=B});
 L(R,'loose',2580,2700,1000,500,0,745,{mat:'wood',on:['S'],desk:true,lab:'study table 1000 × 500 (own)'});
 /* Study chair: The Sleep Company SmartGRID ergonomic chair (Aravindh, 20 Nov), ~650 × 650, facing the study table (south), partly tucked under it. */
 L(R,'chair',3080-325,2100,650,650,0,1300,{on:['S'],face:'S',lab:'chair'});
 A(R,'S','board',1420,200,950,90,10,{lab:'new point'});
 A(R,'W','panel',500,2200,0,1200,60,{mat:'fabric',lab:'headboard panel',dim:true}); // centred on the bed (Aravindh 20 Nov)
 /* Three large framed photos above the headboard (Aravindh 20 Nov): 500 × 700 each, 80 apart, 1400–2100, thin black frames, white mats. */
 [770,1350,1930].forEach(u=>A(R,'W','frame',u,500,1400,700,30,{}));
 L(R,'bed',60,685,2030,1830,0,500,{on:['W'],lab:'king bed 1830 × 2030'});
 L(R,'loose',60,235,400,450,0,500,{mat:'wood',on:['W']});
 L(R,'loose',60,2515,400,450,0,500,{mat:'wood',on:['W']});
 R.vd={E:[[0,1000,'1000'],[0,DH,'2100']],S:[[0,750,'750'],[0,DH,'2100']],N:[[0,1200,'1200'],[0,2400,'2400'],[2400,CEIL,'500']],W:[[0,1200,'1200'],[1200,2400,'1200']]};
 R.spec=[
  ['Room','15′0″ × 10′6″ (4570 × 3200), attached bathroom. Bed on one 10′6″ wall, bathroom door on the opposite one.'],
  ['Bed','King 1830 × 2030, head on the west wall, centred, two 400 × 450 side tables, headboard panel 2200 × 1200.'],
  ['Open shelves','350 wide × 400 deep, 3 open compartments from 1200 to 2400, floor below clear. Right after the bed foot, for quick-access items.'],
  ['Wardrobe','4 doors of about 475, total 1900, running to the bathroom wall, 600 deep. Same overall run as before (shelves + wardrobe = 2250). Mirror covers almost the full first door (about 395 × 1800), next to the open shelves.'],
  ['Edges','Shelves, wardrobe and lofts read as one block: rounded only on the free outer corners (the bed-side edges), flush and square where units meet each other, the ceiling or the bathroom wall.'],
  ['Finishes','Super matt: wardrobe and its lofts in ivory. Normal matt: open shelves and book ledges in ebony wood (22 Nov). No separate closed storage units in this room, so no emerald here.'],
  ['Handles','Slim vertical bar handles, matt black, rounded ends: on every wardrobe and loft shutter, paired at the meeting edges. Loft shutters get a short bar at the bottom corner on the opening side. Open shelves need none.'],
  ['Loft','To the ceiling. One wide unit (825) spans the open shelves and the first wardrobe door; three single units over the other doors.'],
  ['Study chair','The Sleep Company SmartGRID ergonomic chair (high back, headrest, arms, 5-star base on castors), about 650 × 650, at the study table.'],
  ['Study','Your own table (4Homez): 1000 W × 500 D × 745 H, with a white open-shelf side unit at the door end. Pushed towards the room door, stopping about 50 short of the door frame so the door still opens fully. Leaves about 500 clear between the window and the table. New plug point above it.'],
  ['Room door','South-east corner, opens flat against the bathroom wall. Keep that stretch of wall clear.'],
  ['Pelmet','Wooden pelmet 2000 wide, 180 deep, from the window head (2100) to the ceiling, hiding the curtain track. Wall split AC (about 1000 × 300) mounted on it at 2450–2750, centred on the pelmet; the existing AC point is above the window’s right end (site photo), so the pipe runs inside the pelmet.'],
  ['Photos','Three large framed photos above the headboard, 500 × 700 each, 80 apart, 1400–2100, thin black frames with white mats.'],
  ['Book ledges','Three floating ebony ledges on the long north wall only (no L, no closed units, no back panel), from the corner to the open shelf, 2320 long, 250 deep, 36 thick, at 1200 / 1600 / 2000. Concealed brackets. About 7 m of shelf, roughly 170 to 200 books.'],
  ['TV','None.'],
  ['Check on site','Bathroom door frame looks about 550 from the north corner; the wardrobe end may need to be 550 deep there. Window, door and switch positions to be measured.']];
 ROOMS['bedroom-2']=R}

/* open room doors and daylight (Aravindh 22 Nov): room doors open by default, light comes in through the windows and open doors */
var XOPEN=window.XOPEN||(window.XOPEN={
 room(it){return it.kind==='door'&&!it.elevOnly&&!/main|bath|toilet/i.test(it.lab||'')},
 glow(R,it,G,mm,k){const u=it.u0+it.uw/2,a=W2R(R,it.wall,u,1,-150,1),b=W2R(R,it.wall,u,1,1800,1);
  const s=new THREE.SpotLight(0xfff4e0,k,0,.65,.85,1);s.position.set(mm(a.x),mm(Math.min(it.y0+it.h,2100)),mm(a.z));s.target.position.set(mm(b.x),0,mm(b.z));G.add(s,s.target)},
 door(R,it,wbox,G,mm,MAT){const {u0,uw}=it;
  wbox(R,it,u0,uw,0,it.h,-1,3,new THREE.MeshBasicMaterial({color:0xf7f2e8}),false); // doorway: daylight beyond
  if(it.swing){const hu=it.swing==='L'?u0:u0+uw-40;wbox(R,it,hu,40,0,Math.min(it.h,2100),3,uw-40,MAT.door)} // leaf swung back into the room
  XOPEN.glow(R,it,G,mm,.18)},
 clear(){return XOPEN._c||(XOPEN._c=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.07,roughness:0,depthWrite:false}))}, // clear window glass (22 Nov, Aravindh)
 frame(R,it,wbox,MAT){const {u0,uw,y0,h}=it,f=MAT.white; wbox(R,it,u0+uw/2-20,40,y0,h,0,40,f,false); wbox(R,it,u0,uw,y0+Math.min(h*.45,900),40,0,40,f,false)}, // white uPVC mullion + transom
 // curtains in the pelmet, tied back at both edges (never closed): full-height linen drapes gathered by a tie at about 1050
 drape(R,it,wbox,G){const m=XOPEN._d||(XOPEN._d={f:new THREE.MeshStandardMaterial({color:0xe6ddcc,roughness:1}),t:new THREE.MeshStandardMaterial({color:0xb9a98f,roughness:.9})});
  const top=it.y0,ty=1050,grp=new THREE.Group();
  for(const [c,s] of [[it.u0+170,1],[it.u0+it.uw-170,-1]]){ // hourglass drape: wide at the pelmet, gathered by a tie at about 1050, flaring to the floor
   const sh=new THREE.Shape(),hw=y=>y>ty?75+(150-75)*Math.pow((y-ty)/(top-ty),1.4):75+(140-75)*Math.pow((ty-y)/ty,1.2);
   sh.moveTo(c-hw(10),10); for(let y=10;y<=top;y+=50)sh.lineTo(c-hw(y),y); for(let y=top;y>=10;y-=50)sh.lineTo(c+hw(y),y);
   const g=new THREE.ExtrudeGeometry(sh,{depth:50,bevelEnabled:true,bevelThickness:12,bevelSize:14,bevelSegments:3,curveSegments:4}); g.translate(0,0,60); g.scale(.001,.001,.001);
   const o=new THREE.Mesh(g,m.f); o.castShadow=o.receiveShadow=true; grp.add(o);
   const t=new THREE.Mesh(new THREE.BoxGeometry(.17,.05,.1),m.t); t.position.set((c)/1000,ty/1000,.085); grp.add(t)}
  const rod=new THREE.Mesh(new THREE.BoxGeometry((it.uw-80)/1000,.02,.02),m.t); rod.position.set((it.u0+it.uw/2)/1000,(top-20)/1000,.09); grp.add(rod);
  const ROT={N:[0,0,0],E:[-Math.PI/2,R.W,0],S:[Math.PI,R.W,R.D],W:[Math.PI/2,0,R.D]}[it.wall]; grp.rotation.y=ROT[0]; grp.position.set(ROT[1]/1000,0,ROT[2]/1000); G.add(grp)},
 // wardrobe finish (22 Nov, Aravindh ref photo): white matte shutters with a light warm-grey band on the lower third
 band(R,it,wbox){const g=XOPEN._g||(XOPEN._g=new THREE.MeshStandardMaterial({color:0xd3cec7,roughness:.8})),cols=it.cols||1,cw=it.uw/cols;
  for(let j=0;j<cols;j++)wbox(R,it,it.u0+j*cw+4,cw-8,it.y0+4,(it.band||800)-4,(it.t0||0)+it.td+1,4,g,false)}});
/* ---------- SVG helpers ---------- */
const NS='http://www.w3.org/2000/svg', c=n=>`var(--${n})`;
function mkEl(s){return function el(t,a,p=s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}}

/* book spine colours: muted, few hues */
const BOOKC=['#8a6f5a','#5f6b6d','#a89a82','#6f7d68','#b7a58a','#4f4b47','#9a6b5b','#c9bfae'];
/* ---------- elevation ---------- */
const ORDER={ledge:3,frame:6,pelmet:5,ac:6,chair:8,gap:0,panel:1,tile:1,plinth:2,unit:3,open:3,counter:4,cushion:4,door:4,window:4,hood:5,hob:6,sink:6,tv:6,board:7,loose:9,bed:9};
function drawElev(R,wall,letter,title){
  const L0=wlen(R,wall);
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`-560 -330 ${L0+800} ${CEIL+680}`);
  s.setAttribute('role','img');s.setAttribute('aria-label',`Elevation ${letter}, ${title}`);
  s.style.maxWidth=Math.round((L0+800)/5600*100)+'%'; s.style.minWidth=Math.round((L0+800)/5600*600)+'px';
  const el=mkEl(s), Y=y=>CEIL-y;
  const rect=(x,y,w,h,fill='none',sw=4,ex={})=>el('rect',{x,y:Y(y+h),width:w,height:h,fill,stroke:c('fg'),'stroke-width':sw,...ex});
  const line=(x1,y1,x2,y2,sw=3,ex={})=>el('line',{x1,y1:Y(y1),x2,y2:Y(y2),stroke:c('fg'),'stroke-width':sw,...ex});
  const text=(x,y,t,a='middle',sz=42,fill=c('muted'))=>{const e=el('text',{x,y:Y(y),'text-anchor':a,'font-size':sz,fill,'font-family':'Inter,system-ui,sans-serif'});e.textContent=t;return e};
  const mu={stroke:c('muted')};
  const rrect=(x,y,w,h,fill,sw,ex,r)=>{const C=RC(r,w,h),T=Y(y+h),B=Y(y);
    const d=`M${x+C.tl} ${T} L${x+w-C.tr} ${T} Q${x+w} ${T} ${x+w} ${T+C.tr} L${x+w} ${B-C.br} Q${x+w} ${B} ${x+w-C.br} ${B} L${x+C.bl} ${B} Q${x} ${B} ${x} ${B-C.bl} L${x} ${T+C.tl} Q${x} ${T} ${x+C.tl} ${T} Z`;
    return el('path',{d,fill,stroke:c('fg'),'stroke-width':sw,...ex})};
  line(-120,0,L0+120,0,3,mu); line(-120,CEIL,L0+120,CEIL,3,mu); line(0,0,0,CEIL,3,mu); line(L0,0,L0,CEIL,3,mu);

  const list=R.items.map(it=>{
    if(!it.loose) return it.wall===wall?{...it}:null;
    if(!it.on.includes(wall)) return null;
    const w=R2W(R,wall,it.b); return {...it,u0:w.u0,uw:w.uw};
  }).filter(Boolean).sort((a,b)=>ORDER[a.kind]-ORDER[b.kind]);

  const dims=[];
  for(const it of list){
    const {u0,uw,y0,h}=it, stroke=it.chg?c('accent'):c('fg'), sw=it.chg?7:4, fill=c(it.mat||'wood');
    const S={stroke};
    switch(it.kind){
      case 'gap': rect(u0,y0,uw,h,'none',3,{stroke:c('muted'),'stroke-dasharray':'20 14'});break;
      case 'panel': rect(u0,y0,uw,h,fill,4,/headboard/.test(it.lab||'')?{...S,rx:80}:S);
        if(it.fluted)for(let x=u0+60;x<u0+uw-20;x+=60)line(x,y0+20,x,y0+h-20,2,{stroke:c('muted')});break;
      case 'tile': rect(u0,y0,uw,h,c('tile'),3,{stroke:c('muted')});
        for(let x=u0+300;x<u0+uw;x+=300)line(x,y0,x,y0+h,1.5,{stroke:c('muted')});
        line(u0,y0+h/2,u0+uw,y0+h/2,1.5,{stroke:c('muted')});break;
      case 'plinth': rect(u0,y0,uw,h,c('panel'),3,{stroke:c('muted')});break;
      case 'counter': rect(u0-10,y0,uw+20,h+10,c('granite'),3,{rx:8});break;
      case 'cushion': rect(u0+10,y0,uw-20,h,c('fabric'),3,{rx:20});break;
      case 'unit':{
        rrect(u0,y0,uw,h,fill,4,S,it.rc);
        const cols=it.cols||1, rows=it.rows||1, cw=uw/cols, rh=h/rows;
        for(let j=0;j<cols;j++)for(let i=0;i<rows;i++){

    const ROT={N:[0,0,0],E:[-Math.PI/2,R.W,0],S:[Math.PI,R.W,R.D],W:[Math.PI/2,0,R.D]}[it.wall];
    p.rotation.y=ROT[0]; p.position.set(mm(ROT[1]),0,mm(ROT[2])); G.add(p)}
  const wbox=(R,it,u0,uw,y0,h,t0,td,m,edge=true)=>{const b=W2R(R,it.wall,u0,uw,t0,td);box(b.x,y0,b.z,b.w,h,b.d,m,edge)};

  build3D=function(R){
    if(G){scene.remove(G);G.traverse(o=>{o.geometry&&o.geometry.dispose()})}
    G=new THREE.Group(); scene.add(G);
    const W=mm(R.W),D=mm(R.D),H=mm(CEIL);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),MAT.floor); fl.rotation.x=-Math.PI/2; fl.position.set(W/2,0,D/2); fl.receiveShadow=true; G.add(fl);
    const walls=[[W,0,W/2,0,0],[W,Math.PI,W/2,D,0],[D,-Math.PI/2,W,D/2,1],[D,Math.PI/2,0,D/2,1]];
    walls.forEach(([len,ry,x,z])=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(len,H),MAT.wall);p.rotation.y=ry;p.position.set(x,H/2,z);p.receiveShadow=true;G.add(p)});
    for(const it of R.items){
      const m=it.chg?MAT.accent:(MAT[it.mat]||MAT.wood);
      if(it.loose){
        const b=it.b;
        if(it.kind==='bed'){
          softBed(b,it.head||'W');
        } else if(it.kind==='chair'){ // ergonomic chair: 5-star base, gas lift, grid seat and high back, headrest, arms; built facing +x then turned
          const g=new THREE.Group(),K=MAT.chairF,Gd=MAT.chairG,add=(geo,m,x,y,z,rz=0,ry=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(mm(x),mm(y),mm(z));o.rotation.set(0,ry,rz);o.castShadow=true;g.add(o)};
          for(let k=0;k<5;k++){const a=k*Math.PI*2/5;add(new THREE.BoxGeometry(mm(320),mm(30),mm(40)),K,Math.cos(a)*160,75,Math.sin(a)*160,0,-a);add(new THREE.SphereGeometry(mm(28),12,8),K,Math.cos(a)*320,28,Math.sin(a)*320)}
          add(new THREE.CylinderGeometry(mm(35),mm(35),mm(360),16),K,0,260,0); add(new THREE.CylinderGeometry(mm(22),mm(22),mm(120),16),MAT.metal,0,390,0);
          add(softGeo(mm(500),mm(80),mm(500),mm(30),.15),Gd,0,470,0);
          add(softGeo(mm(70),mm(700),mm(490),mm(30),.1),Gd,-265,870,0,.12);
          add(softGeo(mm(60),mm(140),mm(300),mm(30),.1),Gd,-315,1300,0,.12);
          [-265,265].forEach(z=>{add(new THREE.BoxGeometry(mm(30),mm(170),mm(20)),K,-105,605,z);add(new THREE.BoxGeometry(mm(260),mm(25),mm(50)),K,-30,702,z)});
          g.rotation.y={E:0,S:-Math.PI/2,W:Math.PI,N:Math.PI/2}[it.face||'E']; g.position.set(mm(b.x+b.w/2),0,mm(b.z+b.d/2)); G.add(g);
        } else if(it.desk){
          const t=18,X=b.x,Z=b.z,Wd=b.w,Dd=b.d,H=it.h, sw=350, top=H-t;
          box(X,top,Z,Wd,t,Dd,MAT.wood);                       // top
          box(X,0,Z,t,top,Dd,MAT.wood);                         // panel leg (window end)
          box(X+t,top-150,Z+Dd-t,Wd-sw-t,150,t,MAT.wood);       // back apron
          const px=X+Wd-sw;                                     // white shelf unit (door end)
          box(px,0,Z,t,top,Dd,MAT.white); box(px+t,0,Z+Dd-t,sw-t,top,t,MAT.white);
          [0,300].forEach(y=>box(px+t,y,Z,sw-t,t,Dd-t,MAT.white));
        } else if(it.lab&&it.lab.startsWith('study')){
          box(b.x,it.h-30,b.z,b.w,30,b.d,m); [[0,0],[b.w-40,0],[0,b.d-40],[b.w-40,b.d-40]].forEach(([dx,dz])=>box(b.x+dx,0,b.z+dz,40,it.h-30,40,m,false));
        } else box(b.x,it.y0,b.z,b.w,it.h,b.d,m);
        continue;
      }
      const {u0,uw,y0,h,t0,td}=it;
      switch(it.kind){
        case 'gap': break;
        case 'panel': if(/headboard/.test(it.lab||'')){const q=W2R(R,it.wall,u0,uw,0,td);soft(q.x,y0,q.z,q.w,h,q.d,m,Math.min(td/2,90))}else wbox(R,it,u0,uw,y0,h,0,td,m); break;
        case 'tile': wbox(R,it,u0,uw,y0,h,0,10,MAT.tile,false); break;
        case 'plinth': wbox(R,it,u0,uw,y0,h,0,td,MAT.granite,false); break;
        case 'counter': wbox(R,it,u0-10,uw+20,y0,h,0,td,MAT.granite); break;
        case 'cushion': wbox(R,it,u0+10,uw-20,y0,h,0,td,MAT.fabric); break;
        case 'unit':{ if(it.ward)XOPEN.band(R,it,wbox);
          rbox(R,it,u0,uw,y0,h,0,td-18,m,it.rc||0);
          const cols=it.cols||1,rows=it.rows||1,cw=uw/cols,rh=h/rows;
          for(let j=0;j<cols;j++)for(let i=0;i<rows;i++)rbox(R,it,u0+j*cw+3,cw-6,y0+i*rh+3,rh-6,td-18,18,it.glass?MAT.glass:m,SRC(it.rc,j,i,cols,rows,3));
          if(it.mirrorCol!=null)rbox(R,it,u0+it.mirrorCol*cw+40,cw-80,y0+250,1800,td,6,MAT.mirror,20);
          for(let j=0;j<cols;j++)for(let i=0;i<rows;i++){ // handles: slim rounded bars, same logic as elevations
            const x=u0+j*cw, y=y0+i*rh;
            if(rows>1||it.flap) rbox(R,it,x+cw/2-60,120,y+rh-60,16,td,22,MAT.handle,8);
            else{const hx=(cols===1)?x+cw-55:((j+(it.flip?1:0))%2===0?x+cw-55:x+39); if(y>=2000){rbox(R,it,hx,16,y+40,160,td,22,MAT.handle,8);continue} const hy=y<1400?Math.min(y+rh/2,1100):y+rh/2; rbox(R,it,hx,16,hy-120,240,td,22,MAT.handle,8)}
          }
          break}
        case 'ledge': wbox(R,it,u0,uw,y0,h,0,td,MAT[it.mat]||MAT.wood);
          (it.books||[]).forEach(([bu,bw,by,bh,bd,ci])=>wbox(R,it,bu,bw,by,bh,20,bd,BOOKM[ci],false));break;
        case 'open': rbox(R,it,u0,uw,y0,h,0,20,MAT[it.mat]||MAT.panel,it.rc||0);
          if(!it.noL)wbox(R,it,u0,18,y0,h,0,td,(MAT[it.mat]||MAT.wood)); if(!it.noR)wbox(R,it,u0+uw-18,18,y0,h,0,td,(MAT[it.mat]||MAT.wood)); /* noL/noR: open end that runs on into the next unit (L corner) */
          for(let i=0;i<=(it.shelves||3);i++)wbox(R,it,u0,uw,y0+i*(h-18)/(it.shelves||3),18,0,td,(MAT[it.mat]||MAT.wood));
          (it.books||[]).forEach(([bu,bw,by,bh,bd,ci])=>wbox(R,it,bu,bw,by,bh,20,bd,BOOKM[ci],false));break;
        case 'door': if(XOPEN.room(it)){XOPEN.door(R,it,wbox,G,mm,MAT);break} wbox(R,it,u0,uw,y0,h,0,40,MAT.door);
          if(it.mirror)wbox(R,it,u0+150,uw-300,500,1300,40,8,it.chg?MAT.accent:MAT.mirror,false);break;
        case 'pelmet': wbox(R,it,u0,uw,y0,h,0,td,MAT.wood); XOPEN.drape(R,it,wbox,G); break;
        case 'ac': wbox(R,it,u0,uw,y0,h,t0,td,MAT.white); wbox(R,it,u0+60,uw-120,y0+40,30,t0+td-10,14,MAT.granite,false); break;
        case 'frame': wbox(R,it,u0,uw,y0,h,0,30,MAT.frameK,false); wbox(R,it,u0+20,uw-40,y0+20,h-40,30,2,MAT.white,false); wbox(R,it,u0+70,uw-140,y0+70,h-140,32,2,MAT.photo,false); break;
        case 'window': wbox(R,it,u0,uw,y0,h,0,30,XOPEN.clear()); XOPEN.frame(R,it,wbox,MAT); XOPEN.glow(R,it,G,mm,.22); break;
        case 'hood': wbox(R,it,u0+60,uw-120,y0,200,0,td,MAT.metal); wbox(R,it,u0+uw/2-150,300,y0+200,h-200,0,300,MAT.metal); break;
        case 'hob': wbox(R,it,u0,uw,y0,h,40,td,MAT.granite,false); break;
        case 'sink': wbox(R,it,u0,uw,y0,h,60,td,MAT.metal,false); break;
        case 'tv': wbox(R,it,u0,uw,y0,h,20,40,MAT.granite,false); break;
        case 'board': wbox(R,it,u0,uw,y0-45,90,0,10,it.chg?MAT.accent:MAT.white,false); break;
      }
    }
    const span=Math.max(W,D);
    ctl.target.set(W/2,0.9,D/2); ctl.minDistance=1.5; ctl.maxDistance=span*4;
    cam.position.set(W/2+span*0.35,span*1.1+1.2,D+span*0.95);
    sun.target.position.set(W/2,0,D/2);
    ctl.update();
  };
  function size(){const w=host.clientWidth,h=Math.round(w*10/16);r.setSize(w,h,false);r.domElement.style.width='100%';r.domElement.style.height='auto';cam.aspect=w/h;cam.updateProjectionMatrix()}
  addEventListener('resize',size); size();
  (function loop(){ctl.update();r.render(scene,cam);requestAnimationFrame(loop)})();
})();

/* ---------- show room ---------- */
function show(id){
  const R=ROOMS[id];
  document.getElementById('rtitle').textContent=R.name;
  document.getElementById('rnote').innerHTML=R.note;
  drawPlan(R);
  const box=document.getElementById('elevs'); box.textContent='';
  for(const [w,letter,title] of R.elevs){
    const sec=document.createElement('div');
    const h=document.createElement('h3'); h.textContent=`${letter} · ${title}`; sec.appendChild(h);
    const sh=document.createElement('div'); sh.className='sheet'; sh.appendChild(drawElev(R,w,letter,title)); sec.appendChild(sh);
    box.appendChild(sec);
  }
  const dl=document.getElementById('spec'); dl.textContent='';
  R.spec.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;
    dl.append(dt,dd)});
  build3D(R);
}
show('bedroom-2');
</script>

<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-room]");if(a&&window.parent!==window){e.preventDefault();window.parent.go(a.dataset.room)}})</script>
