<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrance Lobby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one drawing sheet per room; plan, elevations, 3D, spec */
:root{
  --bg:#f7f7f5; --fg:#1d1d1b; --muted:#76746f; --line:#d9d7d2;
  --wood:#d8c3a3; --wood2:#b9a08a; --cream:#efe6cf; --white:#fbfbf9; --granite:#3a3936; --glass:#dfe8ea;
  --panel:#eeebe5; --fabric:#c9c6bd; --door:#9c7d5f; --tile:#e6e3dc; --accent:#b4612b;
  --font:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:36px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
p{margin:0;color:var(--muted);max-width:65ch}
.sheet{overflow-x:auto;border-top:1px solid var(--line);padding-top:16px}
svg{display:block;width:100%;height:auto;min-width:600px}
.plan svg{max-width:640px;min-width:420px}
.elevs{display:grid;gap:28px}
#three{width:100%;aspect-ratio:16/10;max-width:100%;border-top:1px solid var(--line);cursor:grab;touch-action:none}
.hint{font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;justify-self:start}
.seg a{font-size:13px;padding:6px 14px;color:var(--muted);text-decoration:none;border-right:1px solid var(--line)}
.seg a:last-child{border-right:0}
.seg a[aria-current="true"]{background:var(--fg);color:var(--bg)}
.seg a:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.chg{color:var(--accent)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 24px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
dt{color:var(--muted)} dd{margin:0;min-width:0}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:520px){dl{grid-template-columns:1fr} dd{margin-bottom:8px}}
</style>
<style>main{grid-template-columns:minmax(0,1fr)}main div,main section,main figure{min-width:0}.plan,.sheet{overflow-x:auto}</style>
</head>
<body>


<main>
  <header style="display:grid;gap:10px">
    <h1>F34 · Entrance lobby</h1>
    <p>Common corridor outside the main door, from the floor plan and site photos (22 Nov). Shoe rack and seat. Sizes in mm are estimates until site measurement.</p>
  </header>
  <section>
    <h2>3D view</h2>
    <div id="three"></div>
    <p class="hint">Drag to rotate. Scroll or pinch to zoom.</p>
  </section>

  <section>
    <h2 id="rtitle">Brief</h2>
    <p id="rnote"></p>
  </section>

  <section>
    <h2>Plan</h2>
    <div class="sheet plan"><svg id="plan" role="img" aria-label="Room plan"></svg></div>
  </section>

  <section>
    <h2>Elevations</h2>
    <div class="elevs" id="elevs"></div>
  </section>


  <section>
    <h2>Spec</h2>
    <dl class="tab" id="spec"></dl>
  </section>
</main>

<script src="../js/three.min.js"></script>
<script src="../js/OrbitControls.js"></script>
<script>
const CEIL=2900, DH=2100;

/* ---------- geometry helpers (mm). Room: x east 0..W, z south 0..D.
   Wall-local: u runs left→right as seen from inside, t = distance out from wall. ---------- */
const wlen=(R,w)=>(w==='N'||w==='S')?R.W:R.D;
function P(R,w,u,t){switch(w){case'N':return[u,t];case'E':return[R.W-t,u];case'S':return[R.W-u,R.D-t];case'W':return[t,R.D-u]}}
function W2R(R,w,u0,uw,t0,td){const a=P(R,w,u0,t0),b=P(R,w,u0+uw,t0+td);
  return{x:Math.min(a[0],b[0]),z:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),d:Math.abs(a[1]-b[1])}}
function R2W(R,w,b){switch(w){
  case'N':return{u0:b.x,uw:b.w,t:b.z};
  case'E':return{u0:b.z,uw:b.d,t:R.W-b.x-b.w};
  case'S':return{u0:R.W-b.x-b.w,uw:b.w,t:R.D-b.z-b.d};
  case'W':return{u0:R.D-b.z-b.d,uw:b.d,t:b.x}}}
function room(o){o.items=[];return o}
function A(R,wall,kind,u0,uw,y0,h,td,o={}){const t0=o.t0||0;R.items.push({kind,wall,u0,uw,y0,h,td,t0,b:W2R(R,wall,u0,uw,t0,td),...o})}
function L(R,kind,x,z,w,d,y0,h,o={}){R.items.push({kind,loose:true,b:{x,z,w,d},y0,h,on:o.on||[],...o})}

/* ---------- rooms ---------- */
const ROOMS={};

/* Guest Bedroom Small (was Bedroom 3) 13'2" x 10'6" */
/* Entrance lobby outside the main door (Aravindh 22 Nov): common corridor 1500 wide between the OTS and Guest Bedroom Small (floor plan).
   Room frame: x east 0..1500, z south 0..2690; W wall = main door wall, E wall = wall opposite the door, S wall = Guest Small's north wall, N = open to the lift lobby. */
{const R=room({id:'entrance',name:'Entrance lobby',W:1500,D:2690,
  note:'The corridor is open towards F35. The closed shoe rack is on the 1500 end wall, 450 clear of the door wall, and an open-shelf bench runs along the block in an L.',
  elevs:[['S','A','Shoe rack (1500 end wall)'],['E','B','Bench (along the block)'],['W','C','Main door and window']]});
 A(R,'W','door',100,1050,0,DH,40,{lab:'main door',swing:null,dim:true});
 /* uPVC window north of the door: louvred section next to the door, fixed pane beyond, sill about 900 (site photos 22 Nov) */
 A(R,'W','window',1450,1190,900,1200,120,{lab:'window'});
 /* waist-high block opposite the door (site photos); the corridor is open beyond it and to the north (towards F35) */
 A(R,'E','unit',1400,1290,0,1000,300,{t0:-300,mat:'wall',cols:1,noHandle:true,lab:'existing block'});
 /* closed shoe rack on the 1500 end wall, 450 clear of the door wall, 1525 (5 ft) high; narrower below 600 so the bench runs under it into the corner */
 A(R,'S','unit',400,650,0,600,350,{mat:'white',cols:1,rows:1,lab:'shoe rack',dim:true});
 A(R,'S','unit',0,1050,600,925,350,{mat:'white',cols:2,rows:2});
 /* bench along the block, into the corner under the rack (L): 1290 long, 400 deep, 600 high, two open shelves (300 each) for daily footwear, no cushions */
 A(R,'E','open',1400,1290,0,600,400,{mat:'white',shelves:2,lab:'bench, open shelves',dim:true});
 R.wallH={N:0,E:0};
 R.vd={E:[[0,300,'300'],[300,600,'300'],[0,1000,'block 1000']],S:[[0,600,'600'],[600,1525,'925'],[0,1525,'1525 (5 ft)']],W:[[900,2100,'window'],[0,DH,'2100']]};
 R.spec=[
  ['Lobby','Common corridor outside the main door, about 1500 wide. It is open: it carries on north towards F35, and opposite the door there is only a waist-high block (about 1000) with open space beyond. North of the door is a uPVC window (louvred section next to the door, fixed pane beyond), sill about 900.'],
  ['Shoe rack','Closed rack for rarely used shoes on the 1500 end wall: about 1050 wide, 350 deep, 1525 (5 ft) high, starting 450 from the door wall. Below 600 it is 650 wide (one tilt flap) so the bench can run under it into the corner; above that, 2 rows of tilt flaps in 2 columns. The top is a ledge for keys. White matte, brushed-aluminium bar handles, ventilation slots in the flaps.'],
  ['Bench','Against the block, running into the corner under the rack to form an L: about 1290 long, 400 deep, 600 high, no cushions. Below the top are two open shelves, about 300 each, for everyday footwear. All rack flaps stay clear of the bench.'],
  ['Clearance','450 between the door wall and the rack, and about 1100 between the door wall and the bench. Everything stays inside F34\'s frontage, so the corridor towards F35 is untouched.'],
  ['Check','Exact block size and height on site. Society rules on fixtures in the common lobby.']];
 ROOMS['entrance']=R}

/* Handle for shutter j,i of a unit: [u-centre, y-centre, length, 'v'|'h'] (mm). Bar handles, 30 from the opening edge. */
function handle(it,j,i){
  const cols=it.cols||1, rows=it.rows||1, cw=it.uw/cols, rh=it.h/rows, x=it.u0+j*cw, y=it.y0+i*rh;
  if(rows>1||it.flap) return [x+cw/2, y+rh-70, 200, 'h'];
  const right=(cols===1)||(j%2===0), hx=right?x+cw-30:x+30;
  if(it.y0>=2300) return [hx, y+150, 160, 'v'];
  return [hx, Math.min(y+rh/2,1050), 300, 'v'];
}
/* Corner radii. rc on an item = rounded corners of its front face {tl,tr,bl,br}; corners where units touch,
   or that meet the floor, ceiling or a wall, stay square so a run reads as one block. */
const RC=it=>it.rc||{};
function subRC(it,x,y,w,h,inset){const r=RC(it),o={},e=2;
  if(r.tl&&Math.abs(x-it.u0)<e+inset&&Math.abs(y+h-(it.y0+it.h))<e+inset)o.tl=r.tl-inset;
  if(r.tr&&Math.abs(x+w-(it.u0+it.uw))<e+inset&&Math.abs(y+h-(it.y0+it.h))<e+inset)o.tr=r.tr-inset;
  if(r.bl&&Math.abs(x-it.u0)<e+inset&&Math.abs(y-it.y0)<e+inset)o.bl=r.bl-inset;
  if(r.br&&Math.abs(x+w-(it.u0+it.uw))<e+inset&&Math.abs(y-it.y0)<e+inset)o.br=r.br-inset;
  return o}
/* open room doors and daylight (Aravindh 22 Nov): room doors open by default, light comes in through the windows and open doors */
var XOPEN=window.XOPEN||(window.XOPEN={
 room(it){return it.kind==='door'&&!it.elevOnly&&!/main|bath|toilet/i.test(it.lab||'')},
 glow(R,it,G,mm,k){const u=it.u0+it.uw/2,a=W2R(R,it.wall,u,1,-150,1),b=W2R(R,it.wall,u,1,1800,1);
  const s=new THREE.SpotLight(0xfff4e0,k,0,.65,.85,1);s.position.set(mm(a.x),mm(Math.min(it.y0+it.h,2100)),mm(a.z));s.target.position.set(mm(b.x),0,mm(b.z));G.add(s,s.target)},
 door(R,it,wbox,G,mm,MAT){const {u0,uw}=it;
  wbox(R,it,u0,uw,0,it.h,-1,3,new THREE.MeshBasicMaterial({color:0xf7f2e8}),false); // doorway: daylight beyond
  if(it.swing){const hu=it.swing==='L'?u0:u0+uw-40;wbox(R,it,hu,40,0,Math.min(it.h,2100),3,uw-40,MAT.door)} // leaf swung back into the room
  XOPEN.glow(R,it,G,mm,.18)},
 clear(){return XOPEN._c||(XOPEN._c=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.07,roughness:0,depthWrite:false}))}, // clear window glass (22 Nov, Aravindh)
 frame(R,it,wbox,MAT){const {u0,uw,y0,h}=it,f=MAT.white; wbox(R,it,u0+uw/2-20,40,y0,h,0,40,f,false); wbox(R,it,u0,uw,y0+Math.min(h*.45,900),40,0,40,f,false)}, // white uPVC mullion + transom
 // curtains in the pelmet, tied back at both edges (never closed): full-height linen drapes gathered by a tie at about 1050
 drape(R,it,wbox,G){const m=XOPEN._d||(XOPEN._d={f:new THREE.MeshStandardMaterial({color:0xe6ddcc,roughness:1}),t:new THREE.MeshStandardMaterial({color:0xb9a98f,roughness:.9})});
  const top=it.y0,ty=1050,grp=new THREE.Group();
  for(const [c,s] of [[it.u0+170,1],[it.u0+it.uw-170,-1]]){ // hourglass drape: wide at the pelmet, gathered by a tie at about 1050, flaring to the floor
   const sh=new THREE.Shape(),hw=y=>y>ty?75+(150-75)*Math.pow((y-ty)/(top-ty),1.4):75+(140-75)*Math.pow((ty-y)/ty,1.2);
   sh.moveTo(c-hw(10),10); for(let y=10;y<=top;y+=50)sh.lineTo(c-hw(y),y); for(let y=top;y>=10;y-=50)sh.lineTo(c+hw(y),y);
   const g=new THREE.ExtrudeGeometry(sh,{depth:50,bevelEnabled:true,bevelThickness:12,bevelSize:14,bevelSegments:3,curveSegments:4}); g.translate(0,0,60); g.scale(.001,.001,.001);
   const o=new THREE.Mesh(g,m.f); o.castShadow=o.receiveShadow=true; grp.add(o);
   const t=new THREE.Mesh(new THREE.BoxGeometry(.17,.05,.1),m.t); t.position.set((c)/1000,ty/1000,.085); grp.add(t)}
  const rod=new THREE.Mesh(new THREE.BoxGeometry((it.uw-80)/1000,.02,.02),m.t); rod.position.set((it.u0+it.uw/2)/1000,(top-20)/1000,.09); grp.add(rod);
  const ROT={N:[0,0,0],E:[-Math.PI/2,R.W,0],S:[Math.PI,R.W,R.D],W:[Math.PI/2,0,R.D]}[it.wall]; grp.rotation.y=ROT[0]; grp.position.set(ROT[1]/1000,0,ROT[2]/1000); G.add(grp)},
 // wardrobe finish (22 Nov, Aravindh ref photo): white matte shutters with a light warm-grey band on the lower third
 band(R,it,wbox){const g=XOPEN._g||(XOPEN._g=new THREE.MeshStandardMaterial({color:0xd3cec7,roughness:.8})),cols=it.cols||1,cw=it.uw/cols;
  for(let j=0;j<cols;j++)wbox(R,it,it.u0+j*cw+4,cw-8,it.y0+4,(it.band||800)-4,(it.t0||0)+it.td+1,4,g,false)}});
/* ---------- SVG helpers ---------- */
const NS='http://www.w3.org/2000/svg', c=n=>`var(--${n})`;
function mkEl(s){return function el(t,a,p=s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}}

/* ---------- elevation ---------- */
const ORDER={frame:6,pelmet:5,ac:6,gap:0,panel:1,tile:1,plinth:2,unit:3,open:3,counter:4,cushion:4,door:4,window:4,hood:5,hob:6,sink:6,tv:6,board:7,loose:9,bed:9};
function drawElev(R,wall,letter,title){
  const L0=wlen(R,wall);
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`-560 -330 ${L0+800} ${CEIL+680}`);
  s.setAttribute('role','img');s.setAttribute('aria-label',`Elevation ${letter}, ${title}`);
  s.style.maxWidth=Math.round((L0+800)/5600*100)+'%'; s.style.minWidth=Math.round((L0+800)/5600*600)+'px';
  const el=mkEl(s), Y=y=>CEIL-y;
  const rect=(x,y,w,h,fill='none',sw=4,ex={})=>el('rect',{x,y:Y(y+h),width:w,height:h,fill,stroke:c('fg'),'stroke-width':sw,...ex});
  const line=(x1,y1,x2,y2,sw=3,ex={})=>el('line',{x1,y1:Y(y1),x2,y2:Y(y2),stroke:c('fg'),'stroke-width':sw,...ex});
  const text=(x,y,t,a='middle',sz=42,fill=c('muted'))=>{const e=el('text',{x,y:Y(y),'text-anchor':a,'font-size':sz,fill,'font-family':'Inter,system-ui,sans-serif'});e.textContent=t;return e};
  const mu={stroke:c('muted')};
  const rrect=(x,y,w,h,r,fill,sw,ex={})=>{const{tl=0,tr=0,bl=0,br=0}=r,X0=x,X1=x+w,T=Y(y+h),B=Y(y);
    return el('path',{d:`M${X0+tl} ${T}H${X1-tr}Q${X1} ${T} ${X1} ${T+tr}V${B-br}Q${X1} ${B} ${X1-br} ${B}H${X0+bl}Q${X0} ${B} ${X0} ${B-bl}V${T+tl}Q${X0} ${T} ${X0+tl} ${T}Z`,fill,stroke:c('fg'),'stroke-width':sw,...ex})};
  line(-120,0,L0+120,0,3,mu); line(-120,CEIL,L0+120,CEIL,3,mu); line(0,0,0,CEIL,3,mu); line(L0,0,L0,CEIL,3,mu);

  const list=R.items.map(it=>{
    if(!it.loose) return it.wall===wall?{...it}:null;
    if(!it.on.includes(wall)) return null;
    const w=R2W(R,wall,it.b); return {...it,u0:w.u0,uw:w.uw};
  }).filter(Boolean).sort((a,b)=>ORDER[a.kind]-ORDER[b.kind]);

  const dims=[];
  for(const it of list){
    const {u0,uw,y0,h}=it, stroke=it.chg?c('accent'):c('fg'), sw=it.chg?7:4, fill=c(it.mat||'wood');
    const S={stroke};
    switch(it.kind){
      case 'gap': rect(u0,y0,uw,h,'none',3,{stroke:c('muted'),'stroke-dasharray':'20 14'});break;
      case 'panel': rect(u0,y0,uw,h,fill,4,/headboard/.test(it.lab||'')?{...S,rx:80}:S);
        if(it.fluted)for(let x=u0+60;x<u0+uw-20;x+=60)line(x,y0+20,x,y0+h-20,2,{stroke:c('muted')});break;
      case 'tile': rect(u0,y0,uw,h,c('tile'),3,{stroke:c('muted')});
        for(let x=u0+300;x<u0+uw;x+=300)line(x,y0,x,y0+h,1.5,{stroke:c('muted')});
        line(u0,y0+h/2,u0+uw,y0+h/2,1.5,{stroke:c('muted')});break;
      case 'plinth': rect(u0,y0,uw,h,c('panel'),3,{stroke:c('muted')});break;
      case 'counter': rect(u0-10,y0,uw+20,h+10,c('granite'),3,{rx:8});break;
      case 'cushion': rect(u0+10,y0,uw-20,h,c('fabric'),3,{rx:20});break;
      case 'unit':{
        rrect(u0,y0,uw,h,RC(it),fill,4,S);
        const cols=it.cols||1, rows=it.rows||1, cw=uw/cols, rh=h/rows;
        for(let j=0;j<cols;j++)for(let i=0;i<rows;i++){
          const x=u0+j*cw, y=y0+i*rh;
          rrect(x+8,y+8,cw-16,rh-16,subRC({...it,u0,uw,y0,h},x+8,y+8,cw-16,rh-16,8),it.glass?c('glass'):fill,3,S);
          if(it.mirrorCol===j){rect(x+40,y0+250,cw-80,1800,c('glass'),3,{rx:20});text(x+cw/2,y0+1100,'mirror','middle',36)}
          const [hx,hy,hl,ho]=handle({...it,u0,uw,y0,h},j,i);
          if(it.noHandle){} else if(ho==='h') line(hx-hl/2,hy,hx+hl/2,hy,10,{stroke:c('muted'),'stroke-linecap':'round'}); else line(hx,hy-hl/2,hx,hy+hl/2,10,{stroke:c('muted'),'stroke-linecap':'round'});
        }
        break}
      case 'open': rrect(u0,y0,uw,h,RC(it),c('panel'),4,S);
        for(let i=1;i<(it.shelves||3);i++)rect(u0+10,y0+i*h/(it.shelves||3)-10,uw-20,20,fill,3);break;
      case 'door':
        rect(u0,y0,uw,h,c('door'),4,S);
        el('circle',{cx:it.swing==='L'?u0+uw-80:u0+80,cy:Y(1000),r:16,fill:c('fg')});
        if(it.mirror){rect(u0+150,y0+500,uw-300,1300,c('glass'),it.chg?6:3,S);text(u0+uw/2,y0+1150,'mirror','middle',38,it.chg?c('accent'):c('muted'))}
        break;
      case 'pelmet': rect(u0,y0,uw,h,c('wood'),4,{...S,rx:12});break;
      case 'ac': rect(u0,y0,uw,h,c('white'),4,{...S,rx:30}); line(u0+60,y0+70,u0+uw-60,y0+70,3,{stroke:c('muted')});break;
      case 'frame': rect(u0,y0,uw,h,c('white'),6,{stroke:'#1d1d1b'}); rect(u0+70,y0+70,uw-140,h-140,c('fabric'),1.5,{stroke:c('muted')});break;
      case 'window': rect(u0,y0,uw,h,c('glass'),4,S); line(u0+uw/2,y0,u0+uw/2,y0+h,3);
        if(it.rail)line(u0,y0+1000,u0+uw,y0+1000,3,{stroke:c('muted'),'stroke-dasharray':'12 10'});break;
      case 'hood': el('path',{d:`M${u0+60} ${Y(y0)} L${u0+uw-60} ${Y(y0)} L${u0+uw/2+170} ${Y(y0+200)} L${u0+uw/2-170} ${Y(y0+200)} Z`,fill:c('panel'),stroke:c('fg'),'stroke-width':4});
        rect(u0+uw/2-150,y0+200,300,h-200,c('panel'),4);break;
      case 'hob': rect(u0,y0,uw,h,c('granite'),3);break;
      case 'sink': line(u0,y0+h,u0+uw,y0+h,8,{stroke:c('muted')});text(u0+uw/2,y0+100,'sink','middle',38);break;
      case 'tv': rect(u0,y0,uw,h,c('granite'),4);break;
      case 'board': rect(u0,y0-45,uw,90,'none',3,S);

        case 'counter': wbox(R,it,u0-10,uw+20,y0,h,0,td,MAT.granite); break;
        case 'cushion': wbox(R,it,u0+10,uw-20,y0,h,0,td,MAT.fabric); break;
        case 'unit':{ if(it.ward)XOPEN.band(R,it,wbox);
          rwbox(R,it,u0,uw,y0,h,0,td-18,m,flip(it.wall,RC(it)),nAx(it.wall));
          const cols=it.cols||1,rows=it.rows||1,cw=uw/cols,rh=h/rows;
          for(let j=0;j<cols;j++)for(let i=0;i<rows;i++)rwbox(R,it,u0+j*cw+3,cw-6,y0+i*rh+3,rh-6,td-18,18,it.glass?MAT.glass:m,flip(it.wall,subRC(it,u0+j*cw+3,y0+i*rh+3,cw-6,rh-6,3)),nAx(it.wall));
          if(it.mirrorCol!=null)rwbox(R,it,u0+it.mirrorCol*cw+40,cw-80,y0+250,1800,td,6,MAT.mirror,20,nAx(it.wall));
          if(!it.noHandle)for(let j=0;j<cols;j++)for(let i=0;i<rows;i++){const [hx,hy,hl,ho]=handle(it,j,i);
            if(ho==='h')rwbox(R,it,hx-hl/2,hl,hy-7,14,td,22,MAT.alu,7,'y'); else rwbox(R,it,hx-7,14,hy-hl/2,hl,td,22,MAT.alu,7,'y')}
          break}
        case 'open': wbox(R,it,u0,uw,y0,h,0,20,MAT.panel);
          wbox(R,it,u0,18,y0,h,0,td,(MAT[it.mat]||MAT.wood)); wbox(R,it,u0+uw-18,18,y0,h,0,td,(MAT[it.mat]||MAT.wood));
          for(let i=0;i<=(it.shelves||3);i++)wbox(R,it,u0,uw,y0+i*(h-18)/(it.shelves||3),18,0,td,(MAT[it.mat]||MAT.wood));break;
        case 'door': if(XOPEN.room(it)){XOPEN.door(R,it,wbox,G,mm,MAT);break} wbox(R,it,u0,uw,y0,h,0,40,MAT.door);
          if(it.mirror)wbox(R,it,u0+150,uw-300,500,1300,40,8,it.chg?MAT.accent:MAT.mirror,false);break;
        case 'pelmet': wbox(R,it,u0,uw,y0,h,0,td,MAT.wood); XOPEN.drape(R,it,wbox,G); break;
        case 'ac': wbox(R,it,u0,uw,y0,h,t0,td,MAT.white); wbox(R,it,u0+60,uw-120,y0+40,30,t0+td-10,14,MAT.granite,false); break;
        case 'frame': wbox(R,it,u0,uw,y0,h,0,30,MAT.frameK,false); wbox(R,it,u0+20,uw-40,y0+20,h-40,30,2,MAT.white,false); wbox(R,it,u0+70,uw-140,y0+70,h-140,32,2,MAT.photo,false); break;
        case 'window': wbox(R,it,u0,uw,y0,h,0,30,XOPEN.clear()); XOPEN.frame(R,it,wbox,MAT); XOPEN.glow(R,it,G,mm,.22); break;
        case 'hood': wbox(R,it,u0+60,uw-120,y0,200,0,td,MAT.metal); wbox(R,it,u0+uw/2-150,300,y0+200,h-200,0,300,MAT.metal); break;
        case 'hob': wbox(R,it,u0,uw,y0,h,40,td,MAT.granite,false); break;
        case 'sink': wbox(R,it,u0,uw,y0,h,60,td,MAT.metal,false); break;
        case 'tv': wbox(R,it,u0,uw,y0,h,20,40,MAT.granite,false); break;
        case 'board': wbox(R,it,u0,uw,y0-45,90,0,10,it.chg?MAT.accent:MAT.white,false); break;
      }
    }
    const span=Math.max(W,D);
    ctl.target.set(W/2,0.9,D/2); ctl.minDistance=1.5; ctl.maxDistance=span*4;
    cam.position.set(W/2+span*0.25,span*0.75+0.9,-span*0.85); // entrance: look in from the lift lobby (north)
    sun.target.position.set(W/2,0,D/2);
    ctl.update();
  };
  function size(){const w=host.clientWidth,h=Math.round(w*10/16);r.setSize(w,h,false);r.domElement.style.width='100%';r.domElement.style.height='auto';cam.aspect=w/h;cam.updateProjectionMatrix()}
  addEventListener('resize',size); size();
  (function loop(){ctl.update();r.render(scene,cam);requestAnimationFrame(loop)})();
})();

/* ---------- show room ---------- */
function show(id){
  const R=ROOMS[id];
  document.querySelectorAll('.seg a[href^="#"]').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+R.id));
  
  document.getElementById('rnote').innerHTML=R.note;
  drawPlan(R);
  const box=document.getElementById('elevs'); box.textContent='';
  for(const [w,letter,title] of R.elevs){
    const sec=document.createElement('div');
    const h=document.createElement('h3'); h.textContent=`${letter} · ${title}`; sec.appendChild(h);
    const sh=document.createElement('div'); sh.className='sheet'; sh.appendChild(drawElev(R,w,letter,title)); sec.appendChild(sh);
    box.appendChild(sec);
  }
  const dl=document.getElementById('spec'); dl.textContent='';
  R.spec.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;
    if(k==='Change'){dt.className='chg'}dl.append(dt,dd)});
  build3D(R);
}
show('entrance');
</script>

<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-room]");if(a&&window.parent!==window){e.preventDefault();window.parent.go(a.dataset.room)}})</script>
