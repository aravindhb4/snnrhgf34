<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F34 Master Bedroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one drawing sheet per room; plan, elevations, 3D, spec */
:root{
  --bg:#f7f7f5; --fg:#1d1d1b; --muted:#76746f; --line:#d9d7d2;
  --wood:#d8c3a3; --wood2:#b9a08a; --cream:#efe6cf; --white:#fbfbf9; --granite:#3a3936; --glass:#dfe8ea; --ivory:#ebe5da; --glow:#d9a94a;
  --panel:#eeebe5; --fabric:#c9c6bd; --door:#9c7d5f; --tile:#e6e3dc; --accent:#b4612b; --alu:#9fa1a0;
  --font:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638; --ivory:#57524a; --glow:#c99a45;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; --alu:#a7a9a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --fg:#ecebe7; --muted:#9a9891; --line:#3a3936;
  --wood:#8a7458; --wood2:#6e5a4b; --cream:#5d5747; --white:#2e2e2b; --granite:#0c0c0b; --glass:#2c3638; --ivory:#57524a; --glow:#c99a45;
  --panel:#232321; --fabric:#4a4843; --door:#5c4a39; --tile:#2a2a27; --accent:#e08a4f; --alu:#a7a9a8; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:36px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
p{margin:0;color:var(--muted);max-width:65ch}
.sheet{overflow-x:auto;border-top:1px solid var(--line);padding-top:16px}
svg{display:block;width:100%;height:auto;min-width:600px}
.plan svg{max-width:640px;min-width:420px}
.elevs{display:grid;gap:28px}
#three{width:100%;aspect-ratio:16/10;max-width:100%;border-top:1px solid var(--line);cursor:grab;touch-action:none}
.hint{font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;justify-self:start}
.seg a{font-size:13px;padding:6px 14px;color:var(--muted);text-decoration:none;border-right:1px solid var(--line)}
.seg a:last-child{border-right:0}
.seg a[aria-current="true"]{background:var(--fg);color:var(--bg)}
.seg a:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.chg{color:var(--accent)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 24px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
dt{color:var(--muted)} dd{margin:0;min-width:0}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:520px){dl{grid-template-columns:1fr} dd{margin-bottom:8px}}
</style>
<style>main{grid-template-columns:minmax(0,1fr)}main div,main section,main figure{min-width:0}.plan,.sheet{overflow-x:auto}</style>
</head>
<body>


<main>
  <header style="display:grid;gap:10px">
    <h1>F34 · Master Bedroom</h1>
    <p>Drawn from DesignCafe's 3D renders, the sale-agreement plan and site photos. Sizes in mm and are proposals; confirm after site measurement.</p>
  </header>
  <section>
    <h2>3D view</h2>
    <div id="three"></div>
    <p class="hint">Drag to rotate. Scroll or pinch to zoom.</p>
  </section>

  <section>
    <h2 id="rtitle"></h2>
    <p id="rnote"></p>
  </section>

  <section>
    <h2>Plan</h2>
    <div class="sheet plan"><svg id="plan" role="img" aria-label="Room plan"></svg></div>
  </section>

  <section>
    <h2>Elevations</h2>
    <div class="elevs" id="elevs"></div>
  </section>


  <section>
    <h2>Spec</h2>
    <dl class="tab" id="spec"></dl>
  </section>
</main>

<script src="../js/three.min.js"></script>
<script src="../js/OrbitControls.js"></script>
<script>
const CEIL=2900, DH=2100;

/* ---------- geometry helpers (mm). Room: x east 0..W, z south 0..D.
   Wall-local: u runs left→right as seen from inside, t = distance out from wall. ---------- */
const wlen=(R,w)=>(w==='N'||w==='S')?R.W:R.D;
function P(R,w,u,t){switch(w){case'N':return[u,t];case'E':return[R.W-t,u];case'S':return[R.W-u,R.D-t];case'W':return[t,R.D-u]}}
function W2R(R,w,u0,uw,t0,td){const a=P(R,w,u0,t0),b=P(R,w,u0+uw,t0+td);
  return{x:Math.min(a[0],b[0]),z:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),d:Math.abs(a[1]-b[1])}}
function R2W(R,w,b){switch(w){
  case'N':return{u0:b.x,uw:b.w,t:b.z};
  case'E':return{u0:b.z,uw:b.d,t:R.W-b.x-b.w};
  case'S':return{u0:R.W-b.x-b.w,uw:b.w,t:R.D-b.z-b.d};
  case'W':return{u0:R.D-b.z-b.d,uw:b.d,t:b.x}}}
function room(o){o.items=[];return o}
function A(R,wall,kind,u0,uw,y0,h,td,o={}){const t0=o.t0||0;R.items.push({kind,wall,u0,uw,y0,h,td,t0,b:W2R(R,wall,u0,uw,t0,td),...o})}
function L(R,kind,x,z,w,d,y0,h,o={}){R.items.push({kind,loose:true,b:{x,z,w,d},y0,h,on:o.on||[],...o})}

/* ---------- rooms ---------- */
const ROOMS={};
/* Master Bedroom (was Bedroom 1). North up as in the brochure plan.
   Main area 10'6" x 13'6" (window wall to toilet wall). North of it a passage with the room door and toilet door.
   Toilet 5'x8': 5' face holds the wardrobe; it projects TB_D into the room and the rest continues outside. Bay window south wall, west end. */
const MAIN=4110, TB_W=1600, TB_D=1200, TB_LEN=2440, BAY_X=150, BAY_W=2000, BAY_D=450, RD=MAIN+TB_D;
const BED_Z=(TB_D+600+RD)/2; // bed centre, centred on the free bed wall
{const R=room({id:'bedroom-1',name:'Master Bedroom',W:3200,D:RD,top:1300,mk:{N:0.62},hole:{x0:BAY_X,x1:BAY_X+BAY_W,y0:450,y1:2150},
  note:'From site photos IMG_3044–3049, the brochure plan and the sale-agreement plan. 13′6″ runs from the window wall to the toilet wall; the passage with the room door and toilet door is extra. Toilet to the right as you enter, wardrobe on its 5′ face, bed on the west wall, foldable study table opposite the bed, between the low plug point and the dresser.',
  elevs:[['N','A','Toilet wall: wardrobe, passage and room door'],['W','B','Bed wall'],['E','C','Desk and 43″ TV'],['S','D','Bay window and dresser']]});
 A(R,'N','door',2250,900,0,DH,40,{lab:'room door',swing:'R',dim:true});
 A(R,'N','unit',0,TB_W,0,2400,600,{t0:TB_D,mat:'wood',cols:3,hs:['L','R','L'],lab:'wardrobe',dim:true,round:'bottom',carcH:2900});
 A(R,'N','unit',0,TB_W,2400,500,600,{t0:TB_D,mat:'wood',cols:3,hs:['L','R','L'],round:'top',noCarc:true});
 A(R,'N','board',1950,180,1200,0,10,{});
 A(R,'W','panel',RD-BED_Z-1115,2230,0,1200,60,{mat:'fabric',lab:'headboard panel',dim:true});
 /* Three large framed photos above the headboard (Aravindh 20 Nov): 500 × 700 each, 80 apart, 1400–2100, thin black frames, white mats. */
 [-830,-250,330].forEach(d=>A(R,'W','frame',RD-BED_Z+d,500,1400,700,30,{}));
 A(R,'W','panel',MAIN-600,600,0,CEIL,10,{mat:'wood',lab:'wardrobe side',elevOnly:true});
 A(R,'W','gap',MAIN,TB_D,0,CEIL,0,{lab:'toilet',elevOnly:true});
 L(R,'bed',60,BED_Z-915,2074,1830,0,500,{on:['W'],lab:'king bed, 7 ft overall'}); // 22 Nov: cot + headrest cushions make it about 7 ft (2134) from the wall
 L(R,'loose',60,BED_Z+915,400,450,0,500,{mat:'wood',on:['W']});
 /* East wall (u from the north/passage end). Plug board low at about 550, near the middle of the wall (site photo 20 Nov, estimated).
    Study table between the plug board and the dresser, nearly centred on the bed (50 towards the dresser), per Aravindh 20 Nov. */
 const PLUG_U=2600, PLUG_W=260, DESK_W=1200, DESK_U=BED_Z+50-DESK_W/2;
 /* 22 Nov (Aravindh): 43" TV above the table. Foldable table replaced by a fixed floating desk with two drawers that also holds the TV items. */
 A(R,'E','unit',DESK_U,DESK_W,600,150,330,{mat:'wood',cols:2,flap:true,rf:30,lab:'desk + TV console',dim:true}); // 330 deep (22 Nov, Aravindh) for about 740 clear to the bed foot; rounded drawer fronts, centred pull handles
 A(R,'E','tv',DESK_U+DESK_W/2-480,960,1150,560,40,{lab:'43″ TV'});
 A(R,'E','board',PLUG_U,PLUG_W,550,0,10,{lab:'plug point',dim:true});
 A(R,'E','ac',DESK_U+DESK_W/2-500,1000,2350,300,230,{lab:'AC'}); // wall split AC centred over the study table (20 Nov)
 A(R,'E','door',0,900,0,DH,40,{lab:'room door (open)',elevOnly:true});
 /* Mirror dresser (Aravindh's reference photo, 20 Nov): ivory; storage tower on the left (corner side): 3 drawers, open backlit shelves above, top level with the mirror door;
    tall mirror door on the right, hinged on its right edge, handle on the left edge, storage behind. */
 A(R,'S','vanity',0,950,0,2150,400,{mat:'ivory',sw:380,dim:true});
 A(R,'S','panel',3200-BAY_X-BAY_W,BAY_W,420,30,10,{mat:'tile',lab:'',elevOnly:true});
 A(R,'S','cushion',3200-BAY_X-BAY_W,BAY_W,450,80,10,{elevOnly:true});
 A(R,'S','cushion',3200-BAY_X-100,110,530,600,10,{elevOnly:true}); // backrest cushion on the bay's west (brick) side
 A(R,'S','window',3200-BAY_X-BAY_W,BAY_W,450,1650,40,{dim:true,elevOnly:true});
 {const u=3200-BAY_X-BAY_W, top=2150, bot=540;
  A(R,'S','curtain',u,BAY_W,bot,top-bot,10,{sheer:true,elevOnly:true});
  A(R,'S','board',u-30,BAY_W+60,top,0,10,{elevOnly:true,rod:true,lab:'sheer curtain on a track along the bay'});}
 R.vd={N:[[0,2400,'2400'],[2400,CEIL,'500']],W:[[0,1200,'1200']],E:[[0,550,'550'],[0,750,'750'],[1150,1710,'560']],S:[[0,900,'900'],[0,2150,'2150'],[0,450,'450'],[450,2100,'1650']]};
 R.plan=(el,text)=>{
  // toilet: part inside the room, rest continues outside (dashed)
  el('rect',{x:0,y:0,width:TB_W,height:TB_D,fill:c('panel'),stroke:'none'});
  el('path',{d:`M0 ${TB_D} H${TB_W} V0`,fill:'none',stroke:c('fg'),'stroke-width':60});
  el('rect',{x:0,y:TB_D-TB_LEN,width:TB_W,height:TB_LEN-TB_D-120,fill:'none',stroke:c('muted'),'stroke-width':6,'stroke-dasharray':'30 20'});
  el('rect',{x:TB_W-40,y:250,width:80,height:750,fill:c('bg')});
  el('line',{x1:TB_W,y1:250,x2:TB_W-750,y2:250,stroke:c('fg'),'stroke-width':8});
  el('path',{d:`M${TB_W-750} 250 A 750 750 0 0 0 ${TB_W} 1000`,fill:'none',stroke:c('muted'),'stroke-width':4,'stroke-dasharray':'20 14'});
  text(TB_W/2-150,TB_D/2+250,'toilet','middle',95);
  text(TB_W/2,TB_D-TB_LEN+500,'toilet 5′ × 8′','middle',85);
  text(TB_W/2,TB_D-TB_LEN+620,'continues outside','middle',70);
  // 13'6" main length
  text(-430,TB_D+MAIN/2,`${MAIN} (13′6″) to toilet wall`,'middle',90).setAttribute('transform',`rotate(-90 -430 ${TB_D+MAIN/2})`);
  // bay window: tile top with cushion
  el('rect',{x:BAY_X,y:RD-10,width:BAY_W,height:150,fill:c('bg')});
  el('rect',{x:BAY_X,y:RD,width:BAY_W,height:BAY_D,fill:c('tile'),stroke:c('fg'),'stroke-width':6});
  el('rect',{x:BAY_X+40,y:RD+30,width:BAY_W-80,height:BAY_D-60,fill:c('fabric'),stroke:'none',rx:40});
  el('path',{d:`M${BAY_X} ${RD} V${RD+BAY_D} H${BAY_X+BAY_W} V${RD}`,fill:'none',stroke:c('fg'),'stroke-width':14});
  el('rect',{x:BAY_X-120,y:RD,width:120,height:BAY_D+60,fill:c('fg')}); // west side: brick wall
  el('rect',{x:BAY_X+10,y:RD+20,width:80,height:BAY_D-40,rx:30,fill:c('fabric'),stroke:c('fg'),'stroke-width':4}); // lean-back cushion
  el('path',{d:`M${BAY_X+70} ${RD+BAY_D-70} H${BAY_X+BAY_W-70} V${RD}`,fill:'none',stroke:c('fg'),'stroke-width':8,'stroke-dasharray':'40 20'});
  text(BAY_X+BAY_W/2,RD+BAY_D/2+35,'bay seat, cushion','middle',85,c('fg'));
  text(BAY_X+BAY_W/2,RD+BAY_D+180,'curtain rod along the bay','middle',70);
 };
 R.three=(box,MAT,soft)=>{
  box(0,0,0,TB_W,CEIL,TB_D,MAT.wall);
  box(TB_W,0,250,40,DH,750,MAT.door);
  box(BAY_X,0,RD,BAY_W,450,BAY_D,MAT.tile);
  box(BAY_X+30,450,RD+20,BAY_W-60,80,BAY_D-40,MAT.fabric,true,30);
  const CLR=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.07,roughness:0,depthWrite:false}); // clear glass (22 Nov, Aravindh)
  box(BAY_X,450,RD+BAY_D-20,BAY_W,1700,20,CLR);
  box(BAY_X+BAY_W/2-25,450,RD+BAY_D-45,50,1700,45,MAT.white,false); box(BAY_X,1280,RD+BAY_D-45,BAY_W,50,45,MAT.white,false); // white uPVC mullion and transom (site photo)
  box(BAY_X+BAY_W-45,1280,RD,45,50,BAY_D,MAT.white,false);
  box(BAY_X-120,0,RD,120,2230,BAY_D,MAT.wall,false); box(BAY_X+BAY_W-20,450,RD,20,1700,BAY_D,CLR); // west side is brick wall (site photo 20 Nov), east side glass
  soft(BAY_X,530,RD+15,90,600,BAY_D-30,MAT.fabric,40,.08);              // half-height backrest cushion on the west wall
  box(BAY_X,2150,RD,BAY_W,80,BAY_D,MAT.white);
  [[BAY_X,0],[BAY_X+BAY_W-40,0]].forEach(([x])=>box(x,450,RD+BAY_D-40,40,1700,40,MAT.white,false));
  box(3200-750,1000,RD-12,700,1200,12,MAT.glass);
  // bay curtain (22 Nov, Aravindh): thin sheer only, sliding on a slim aluminium track that follows the bay (same as the entrance screens); no thick drapes
  const cz=RD+BAY_D-70, cx0=BAY_X+70, cx1=BAY_X+BAY_W-70;
  box(cx0,2120,cz-40,cx1-cx0,25,40,XTRA.mats().alu,false); box(cx1-40,2120,RD+20,40,25,cz-RD-20,XTRA.mats().alu,false); // track along the long side and the leg side
  XTRA.sheer(box,'x',cx0,cx0+380,cz-20,2120,560); XTRA.sheer(box,'x',cx1-420,cx1,cz-20,2120,560); XTRA.sheer(box,'z',RD+20,RD+280,cx1-20,2120,560); // slid open to the ends; none on the brick (cushion) side
 };
 /* Daylight through the bay (22 Nov, Aravindh): bright sky behind the glass, a warm sun patch falling into the room with curtain shadows, and soft fill near the window. */
 R.light=(G,mm)=>{
  const sky=new THREE.Mesh(new THREE.PlaneGeometry(mm(BAY_W+600),mm(2200)),new THREE.MeshBasicMaterial({color:0xf4f8fb}));
  sky.position.set(mm(BAY_X+BAY_W/2),mm(1300),mm(RD+BAY_D+60)); sky.rotation.y=Math.PI; G.add(sky);
  const sun=new THREE.SpotLight(0xfff1da,1.1,9,Math.PI/3.2,.55,1.2); sun.position.set(mm(BAY_X+BAY_W/2+300),mm(2050),mm(RD+300));
  sun.target.position.set(mm(BAY_X+BAY_W/2+500),0,mm(RD-2000)); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-0.0005;
  G.add(sun); G.add(sun.target);
  const fill=new THREE.PointLight(0xfff6ea,.45,4.5,1.5); fill.position.set(mm(BAY_X+BAY_W/2),mm(1400),mm(RD-400)); G.add(fill);
 };
 R.spec=[
  ['Room','10′6″ × 13′6″ (3200 × 4110) from the window wall to the toilet wall, plus a passage of about 1200 to the room door. Wooden floor: medium-brown wood-look planks running east to west, matching skirting (site photo).'],
  ['Toilet','5′ × 8′. The 5′ face is the wardrobe wall; about 1200 of the 8′ projects into the room, the rest is outside it. Door on its side, to the right as you enter.'],
  ['Wardrobe','1600 (5′ toilet face) × 600 deep, 3 hinged shutters about 533 wide to 2400, loft to the ceiling.'],
  ['Bed','King 1830 wide, about 7 ft (2134) from the wall to the foot including the cot and headrest cushions, centred on the west wall, headboard panel 2230 × 1200. One side table 400 × 450 on the window side; none on the wardrobe side so the wardrobe doors open freely.'],
  ['Desk + TV','43″ TV (about 960 × 560) wall-mounted at 1150–1710, centred over a fixed floating desk 1200 × 330 × 150 (top at 750, rounded edges and rounded drawer fronts like the living TV unit, centred horizontal pull handles; about 740 clear to the foot of the bed) with two drawers for the set-top box, remotes and cables; the desk still works as a study table, with 400 clear between the desk top and the TV. Replaces the foldable table. Existing plug point stays low (about 550, below the desk); run a concealed conduit from it to a new socket behind the TV.'],
  ['AC','Wall split AC about 1000 × 300 × 230, at 2350–2650, centred over the study table.'],
  ['Photos','Three large framed photos above the headboard, 500 × 700 each, 80 apart, 1400–2100, thin black frames with white mats.'],
  ['Dresser','Mirror dresser 950 × 400 × 2150 in the south-east corner, ivory (as in the reference photo). Left (corner side): 380 tower with 3 drawers to 880, a top at 900, and open shelves with warm back lighting to 2150, level with the mirror door. Right: 570 tall mirror door with a rounded warm LED frame, hinged on its right edge, brushed-aluminium handle on its left edge, shelves behind. Plain fronts, no fluting.'],
  ['Window','Existing bay with a plain tile top, about 2000 wide, 450 deep, at 450. Cushion on top. Glass on the front and the east side; the west side is a solid brick wall (site photo), with a half-height backrest cushion (530 to 1130) to lean against. Clear glass with white uPVC frames (site photo). Thin sheer curtain only, on a slim brushed-aluminium track along the long glass side and the leg-side glass (none on the brick, cushion side), slides fully open to the ends, ending just above the cushion (no thick drapes, 22 Nov).'],
  ['Edges','Rounded only on the outer edges of each unit or run. Wardrobe and loft read as one block; shutters and drawer fronts are plain where they meet.'],
  ['Handles','Slim brushed aluminium bar handles: vertical 300 bars on wardrobe shutters at 1100, short horizontal pulls on drawers; loft shutters get a short upright bar at the bottom corner on the opening side, matching the wardrobe door below. The fold-down study table gets a finger pull at its front edge.'],
  ['Open points','Passage depth, plug point position and height, bay width. All sizes to be measured.']];
 ROOMS['bedroom-1']=R}


/* entrance sheer curtains + key holder (22 Nov, Aravindh): shared helpers, drawn in room coordinates */
var XTRA=window.XTRA||{
 mats(){if(!XTRA.m)XTRA.m={sheer:new THREE.MeshStandardMaterial({color:0xf1ebdf,transparent:true,opacity:.5,roughness:.95,side:THREE.DoubleSide,depthWrite:false}),
   alu:new THREE.MeshStandardMaterial({color:0xd4d7d9,metalness:.15,roughness:.4}),wenge:new THREE.MeshStandardMaterial({color:0x3b2a22,roughness:.7}),
   black:new THREE.MeshStandardMaterial({color:0x151515,roughness:.6}),chrome:new THREE.MeshStandardMaterial({color:0xd8dadc,metalness:.4,roughness:.25})};return XTRA.m},
 // sheer curtain on a slim track: o='x' runs along x at z=c, o='z' runs along z at x=c; a0..a1 along it; top = track height; pleated in 40 mm folds
 sheer(box,o,a0,a1,c,top,bot=10){const m=XTRA.mats(),n=Math.round((a1-a0)/40),s=(a1-a0)/n;
   if(o==='x')box(a0,bot,c-2,a1-a0,top-5-bot,4,m.sheer,false); else box(c-2,bot,a0,4,top-5-bot,a1-a0,m.sheer,false);      // back layer
   for(let i=0;i<n;i+=2){const a=a0+i*s; if(o==='x')box(a,bot,c+16,s,top-5-bot,3,m.sheer,false); else box(c+16,bot,a,3,top-5-bot,s,m.sheer,false)} // folds
   if(o==='x')box(a0,top,c-20,a1-a0,25,40,m.alu,false); else box(c-20,top,a0,40,25,a1-a0,m.alu,false)},
 // wenge key board 300 x 200 on the wall x=0 (protruding +x), two rows of 6 straight chrome knobs, black strip under each row; centred at height yc, z from z0
 keys(box,z0,yc){const m=XTRA.mats(),y0=yc-100; box(0,y0,z0,18,200,300,m.wenge,false);
