<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F34 Interiors</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--muted:#76746f;--line:#d9d7d2}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
.site{display:flex;height:100vh;height:100dvh}
.side{flex:none;width:210px;overflow-y:auto;padding:32px 12px 24px 20px;border-right:1px solid var(--line)}
.side b{display:block;font-size:15px;font-weight:600;margin:0 0 16px 8px}
.side a{display:block;padding:7px 8px;border-radius:6px;color:var(--muted);text-decoration:none;white-space:nowrap}
.side a:hover{color:var(--fg)}.side a[aria-current]{background:var(--fg);color:var(--bg)}
iframe{flex:1;min-width:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
@media (max-width:800px){.site{flex-direction:column}
.side{width:auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
.side b{display:none}.side a{flex:none}iframe{flex:1;height:auto}}
</style>
</head>
<body>
<div class="site">
<nav class="side" aria-label="Rooms"><b>F34 Interiors</b><a href="#home" data-room="home">Whole home</a><a href="#entrance" data-room="entrance">Entrance</a><a href="#living" data-room="living">Living</a><a href="#dining" data-room="dining">Dining wall</a><a href="#kitchen" data-room="kitchen">Kitchen</a><a href="#master-bedroom" data-room="master-bedroom">Master bedroom</a><a href="#guest-bedroom-large" data-room="guest-bedroom-large">Guest bedroom large</a><a href="#guest-bedroom-small" data-room="guest-bedroom-small">Guest bedroom small</a><a href="#bathrooms" data-room="bathrooms">Bathrooms</a></nav>
<iframe id="view" title="Room view" allow="fullscreen"></iframe>
</div>
<script>
var ROOMS=["home", "entrance", "living", "dining", "kitchen", "master-bedroom", "guest-bedroom-large", "guest-bedroom-small", "bathrooms"],view=document.getElementById('view'),nav=document.querySelector('.side');
function go(k,push){if(ROOMS.indexOf(k)<0)k='home';
  if(view.dataset.room!==k){var u='rooms/'+k+'.html';if(view.dataset.room){try{view.contentWindow.location.replace(u)}catch(e){view.src=u}}else view.src=u;view.dataset.room=k}
  nav.querySelectorAll('a').forEach(function(a){if(a.dataset.room===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var a=nav.querySelector('[aria-current]');if(a&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=a.offsetLeft-16;
  var t=a?a.textContent:'';document.title=(k==='home'?'':t+' · ')+'F34 Interiors';
  if(push!==false&&location.hash!=='#'+k)history.pushState(null,'','#'+k)}
nav.addEventListener('click',function(e){var a=e.target.closest('a[data-room]');if(!a)return;e.preventDefault();go(a.dataset.room)});
addEventListener('popstate',function(){go(location.hash.slice(1),false)});
go(location.hash.slice(1)||'home',false);
</script>
</body>
</html>
